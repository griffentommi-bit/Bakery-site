<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sweeten The Deal Bakery</title>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
(function(){
  emailjs.init("9KMyS9KkzLNPVBOle");
})();
</script>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #fff7f2;
}

header {
    background: #ff7aa2;
    color: white;
    text-align: center;
    padding: 25px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    padding: 20px;
    gap: 15px;
}

.card {
    background: white;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.price {
    font-weight: bold;
    color: #ff4f87;
}

button {
    background: #ff7aa2;
    border: none;
    padding: 10px;
    color: white;
    border-radius: 8px;
    width: 100%;
    cursor: pointer;
}

form {
    max-width: 400px;
    margin: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 20px;
}

input, textarea {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}
</style>
</head>

<body>

<header>
<h1>Sweeten The Deal</h1>
<p>Custom Desserts • Chicago, IL</p>
</header>

<section class="products">

<div class="card">
<h3>Mini Cakes</h3>
<p class="price">$7 each</p>
<button onclick="selectItem('Mini Cakes')">Order</button>
</div>

<div class="card">
<h3>Cookie Box</h3>
<p class="price">$12 per box</p>
<button onclick="selectItem('Cookie Box')">Order</button>
</div>

<div class="card">
<h3>Dessert Box</h3>
<p class="price">$20 per box</p>
<button onclick="selectItem('Dessert Box')">Order</button>
</div>

<div class="card">
<h3>Party Tray</h3>
<p class="price">$35 per tray</p>
<button onclick="selectItem('Party Tray')">Order</button>
</div>

</section>

<form id="orderForm">
<h2 style="text-align:center;">Place Order</h2>

<input type="text" id="name" placeholder="Your Name" required>
<input type="text" id="item" placeholder="Item" required>
<input type="number" id="quantity" placeholder="Quantity" required>
<textarea id="details" placeholder="Custom details"></textarea>

<button type="submit">Send Order</button>
</form>

<script>
function selectItem(item){
    document.getElementById("item").value = item;
    window.location.href = "#orderForm";
}

document.getElementById("orderForm").addEventListener("submit", function(e){
    e.preventDefault();

    emailjs.send("service_5mueiya", "template_3701r98", {
        name: document.getElementById("name").value,
        item: document.getElementById("item").value,
        quantity: document.getElementById("quantity").value,
        details: document.getElementById("details").value
    });

    alert("Order sent successfully!");
    this.reset();
});
</script>

</body>
</html>

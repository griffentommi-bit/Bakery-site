<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sweet Treats Bakery</title>

<style>
body { font-family: Arial; margin:0; background:#fff7f2; }

header {
  background:#ffb6c1;
  padding:15px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
}

.logo {
  width:120px;
  margin:10px auto;
  display:block;
}

.container {
  display:flex;
  gap:20px;
  padding:20px;
  max-width:1200px;
  margin:auto;
}

.box, .cart {
  background:white;
  padding:15px;
  border-radius:10px;
}

.box { flex:1; }
.cart { flex:1.5; }

select, input {
  width:100%;
  padding:10px;
  margin:8px 0;
}

button {
  width:100%;
  padding:12px;
  background:#ff69b4;
  color:white;
  border:none;
  cursor:pointer;
}

button:hover { background:#ff1493; }

.cart-item {
  border-bottom:1px solid #eee;
  padding:10px 0;
}

.summary {
  margin-top:10px;
  padding:10px;
  background:#f9f9f9;
}
</style>
</head>

<body>

<header>
  Sweet Treats Bakery 🍰
</header>

<!-- LOGO PLACEHOLDER -->
<img class="logo" src="logo.png" alt="Bakery Logo"/>

<div class="container">

<!-- MENU -->
<div class="box">

<h3>Menu</h3>

<select id="item">
  <option value="Mini Cake|7">Mini Cake - $7+</option>
  <option value="Cupcakes|3">Cupcakes - $3 each</option>
  <option value="Cake Pops|2.5">Cake Pops - $2.50</option>
  <option value="Cookies|3">Cookies - $3</option>

  <option value="Dipped Oreos|1.5">Dipped Oreos - $1.50</option>
  <option value="Dipped Pretzels|1.5">Dipped Pretzels - $1.50</option>
  <option value="Dipped Strawberries|1.5">Dipped Strawberries - $1.50</option>
  <option value="Dipped Rice Krispies|1.5">Dipped Rice Krispies - $1.50</option>

  <option value="THE DEAL BOX|67">THE DEAL BOX - $67</option>
  <option value="PARTY BOX|330">PARTY BOX - $330</option>
</select>

<input type="number" id="qty" value="1" min="1" max="12"/>

<button onclick="addToCart()">Add to Cart</button>

<hr>

<select id="deliveryType" onchange="toggleAddress()">
  <option value="pickup">Pickup</option>
  <option value="delivery">Delivery</option>
</select>

<div id="addressBox" style="display:none;">
  <input id="address" placeholder="Address"/>
  <input id="zip" placeholder="ZIP"/>
</div>

</div>

<!-- CART -->
<div class="cart">

<h3>Your Cart</h3>
<div id="cart"></div>

<div class="summary" id="summary">
<b>Total:</b> $0.00<br>
<b>Deposit:</b> $0.00
</div>

<button onclick="checkout()">Pay Deposit (CashApp)</button>

</div>

</div>

<script>

let cart = [];
let depositTotal = 0;

function addToCart() {
  let data = document.getElementById("item").value.split("|");
  let name = data[0];
  let price = parseFloat(data[1]);
  let qty = Math.min(parseInt(document.getElementById("qty").value), 12);

  cart.push({name, price, qty});
  render();
}

function removeItem(i){
  cart.splice(i,1);
  render();
}

function deliveryFee(){
  if(document.getElementById("deliveryType").value !== "delivery") return 0;
  let zip = document.getElementById("zip").value;
  if(zip.startsWith("606")) return 5;
  if(zip.startsWith("607")||zip.startsWith("608")) return 8;
  return 10;
}

function render(){
  let html="";
  let total=0;

  cart.forEach((i,index)=>{
    let t=i.price*i.qty;
    total+=t;

    html+=`
      <div class="cart-item">
        <b>${i.name}</b><br>
        $${i.price} × ${i.qty} = $${t.toFixed(2)}<br>
        <button onclick="removeItem(${index})">Remove</button>
      </div>
    `;
  });

  let fee = deliveryFee();
  total += fee;

  depositTotal = total/2;

  document.getElementById("cart").innerHTML = html || "Cart empty";

  document.getElementById("summary").innerHTML =
  `<b>Total:</b> $${total.toFixed(2)}<br>
   <b>Deposit:</b> $${depositTotal.toFixed(2)}`;
}

function checkout(){
  if(cart.length===0) return alert("Cart empty");

  window.location.href =
  `https://cash.app/$TommiGriffen/${depositTotal.toFixed(2)}`;
}

</script>

</body>
</html>

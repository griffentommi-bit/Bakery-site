<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sweet Treats Bakery</title>

<style>

body {
  margin: 0;
  font-family: system-ui, Arial;
  background: #f6f6fb;
}

/* HEADER */
header {
  background: linear-gradient(135deg, #ff4da6, #ff7ac6);
  color: white;
  text-align: center;
  padding: 16px;
  font-size: 22px;
  font-weight: bold;
}

/* CONTAINER */
.container {
  max-width: 720px;
  margin: auto;
  padding: 12px;
}

/* PRODUCT GRID (still single column, but styled like cards) */
.product {
  background: white;
  border-radius: 16px;
  padding: 12px;
  margin-bottom: 12px;
  box-shadow: 0 5px 14px rgba(0,0,0,0.07);
  position: relative;
  overflow: hidden;
}

/* IMAGE PLACEHOLDER */
.product img {
  width: 100%;
  height: 140px;
  object-fit: cover;
  border-radius: 12px;
}

/* TEXT */
.name {
  font-size: 16px;
  font-weight: 700;
  margin-top: 8px;
}

.price {
  color: #ff2f92;
  font-weight: 600;
}

/* BUTTON */
button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border: none;
  border-radius: 10px;
  background: #ff2f92;
  color: white;
  font-weight: bold;
}

button:hover {
  background: #e60073;
}

/* CART BAR (sticky bottom like Uber Eats) */
.cart-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: white;
  padding: 12px;
  box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.cart-bar button {
  width: auto;
  padding: 10px 16px;
}

/* CART PAGE */
.cart-page {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: #fff;
  padding: 12px;
  overflow-y: auto;
}

.cart-item {
  background: #f7f7f7;
  padding: 10px;
  border-radius: 12px;
  margin-bottom: 8px;
}

/* POPUP */
.popup {
  display: none;
  position: fixed;
  top: 20%;
  left: 10%;
  right: 10%;
  background: white;
  padding: 14px;
  border-radius: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.popup button {
  margin-top: 10px;
}

</style>
</head>

<body>

<header>Sweet Treats Bakery 🍰</header>

<div class="container">

<!-- PRODUCTS -->

<div class="product">
  <img src="https://via.placeholder.com/600x300"/>
  <div class="name">Mini Cake</div>
  <div class="price">$7+</div>
  <button onclick="add('Mini Cake',7)">Add</button>
</div>

<div class="product">
  <img src="https://via.placeholder.com/600x300"/>
  <div class="name">Cupcakes</div>
  <div class="price">$3</div>
  <button onclick="add('Cupcakes',3)">Add</button>
</div>

<div class="product">
  <img src="https://via.placeholder.com/600x300"/>
  <div class="name">Cake Pops</div>
  <div class="price">$2.50</div>
  <button onclick="add('Cake Pops',2.5)">Add</button>
</div>

<div class="product">
  <img src="https://via.placeholder.com/600x300"/>
  <div class="name">Dipped Strawberries</div>
  <div class="price">$1.50</div>
  <button onclick="add('Dipped Strawberries',1.5)">Add</button>
</div>

<div class="product">
  <img src="https://via.placeholder.com/600x300"/>
  <div class="name">Deal Box</div>
  <div class="price">View Details</div>
  <button onclick="openPopup('Deal Box')">View Box</button>
</div>

<div class="product">
  <img src="https://via.placeholder.com/600x300"/>
  <div class="name">Party Box</div>
  <div class="price">View Details</div>
  <button onclick="openPopup('Party Box')">View Box</button>
</div>

</div>

<!-- CART BAR -->
<div class="cart-bar">
  <div id="cartTotal">Cart: $0.00</div>
  <button onclick="openCart()">View Cart</button>
</div>

<!-- CART PAGE -->
<div class="cart-page" id="cartPage">

  <h2>Your Cart</h2>

  <div id="cartItems"></div>

  <h3 id="finalTotal"></h3>

  <button onclick="checkout()">Checkout (CashApp)</button>
  <button onclick="closeCart()">Close</button>

</div>

<!-- POPUP -->
<div class="popup" id="popup">
  <h3 id="popupTitle"></h3>
  <p id="popupText"></p>
  <button onclick="closePopup()">Close</button>
</div>

<script>

let cart = [];

/* ADD */
function add(name, price) {
  cart.push({name, price, qty:1});
  updateCart();
}

/* UPDATE */
function updateCart() {

  let total = 0;

  cart.forEach(i => total += i.price * i.qty);

  document.getElementById("cartTotal").innerText =
    "Cart: $" + total.toFixed(2);
}

/* CART PAGE */
function openCart() {

  let html = "";
  let total = 0;

  cart.forEach(i => {
    total += i.price * i.qty;

    html += `<div class="cart-item">
      <b>${i.name}</b><br>
      $${i.price} x ${i.qty}
    </div>`;
  });

  document.getElementById("cartItems").innerHTML = html;
  document.getElementById("finalTotal").innerText =
    "Total: $" + total.toFixed(2);

  document.getElementById("cartPage").style.display = "block";
}

function closeCart() {
  document.getElementById("cartPage").style.display = "none";
}

/* POPUPS */
function openPopup(type) {

  document.getElementById("popup").style.display = "block";

  if (type === "Deal Box") {
    document.getElementById("popupTitle").innerText = "Deal Box";
    document.getElementById("popupText").innerText =
      "Includes dipped treats, cupcakes, cake pops, cookies, mini cake (discount bundle)";
  }

  if (type === "Party Box") {
    document.getElementById("popupTitle").innerText = "Party Box";
    document.getElementById("popupText").innerText =
      "Large bundle with everything in bigger quantities for parties";
  }
}

function closePopup() {
  document.getElementById("popup").style.display = "none";
}

/* CHECKOUT */
function checkout() {
  let total = cart.reduce((a,b) => a + b.price, 0);
  let deposit = total / 2;

  window.location.href =
    "https://cash.app/$TommiGriffen/" + deposit.toFixed(2);
}

</script>

</body>
</html>

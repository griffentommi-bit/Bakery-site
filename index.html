<script>

let cart = [];

function addItem(name, price) {

  let flavor = "";

  if (name === "Mini Cake") {
    flavor = document.getElementById("cakeFlavor").value;
  }

  if (name === "Cupcakes") {
    flavor = document.getElementById("cupFlavor").value;
  }

  cart.push({ name, price, flavor, qty: 1 });
  render();
}

/* ➕ INCREASE QTY */
function increaseQty(index) {
  cart[index].qty += 1;
  render();
}

/* ➖ DECREASE QTY */
function decreaseQty(index) {
  cart[index].qty -= 1;

  if (cart[index].qty <= 0) {
    cart.splice(index, 1);
  }

  render();
}

function dealBoxPrice() {
  return ((4*6*1.5)+(2*2.5)+(2*3)+(2*3)+(2*7))*0.85;
}

function partyBoxPrice() {
  return ((8*12*1.5)+(12*2.5)+(12*3)+(12*3)+(12*7))*0.85;
}

function render() {

  let html = "";
  let total = 0;

  cart.forEach((item, index) => {

    let price = item.price;

    if (item.name === "THE DEAL BOX") price = dealBoxPrice();
    if (item.name === "PARTY BOX") price = partyBoxPrice();

    let itemTotal = price * item.qty;
    total += itemTotal;

    html += `
      <div class="cart-item">
        <b>${item.name}</b> ${item.flavor ? "(" + item.flavor + ")" : ""}<br>

        $${price.toFixed(2)} × ${item.qty} = $${itemTotal.toFixed(2)}<br>

        <button onclick="decreaseQty(${index})">−</button>
        <button onclick="increaseQty(${index})">+</button>
      </div>
    `;
  });

  let deposit = total / 2;

  document.getElementById("cart").innerHTML = html || "Cart empty";

  document.getElementById("summary").innerHTML = `
    <b>Total:</b> $${total.toFixed(2)}<br>
    <b>Deposit:</b> $${deposit.toFixed(2)}
  `;
}

function renderTotal() {
  let total = 0;

  cart.forEach(i => {

    let price = i.price;

    if (i.name === "THE DEAL BOX") price = dealBoxPrice();
    if (i.name === "PARTY BOX") price = partyBoxPrice();

    total += price * i.qty;
  });

  return total;
}

function checkout() {

  if (cart.length === 0) return alert("Cart empty");

  let name = document.getElementById("name").value;
  let phone = document.getElementById("phone").value;
  let email = document.getElementById("email").value;

  if (!name || !phone || !email) {
    alert("Fill out info first");
    return;
  }

  window.location.href =
    `https://cash.app/$TommiGriffen/${(renderTotal()/2).toFixed(2)}`;
}

</script>

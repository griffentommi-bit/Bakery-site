<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sweet Treats Bakery</title>

<style>

/* ===== GLOBAL ===== */
body {
  margin: 0;
  font-family: system-ui, -apple-system, Arial;
  background: #f4f4f8;
  color: #222;
}

/* ===== HEADER (APP STYLE) ===== */
header {
  background: linear-gradient(135deg, #ff4da6, #ff7ac6);
  color: white;
  padding: 18px;
  text-align: center;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.logo {
  width: 70px;
  display: block;
  margin: 10px auto;
}

/* ===== SINGLE COLUMN APP FEED ===== */
.container {
  max-width: 720px;
  margin: auto;
  padding: 14px;
}

/* ===== CARD SYSTEM (REAL APP LOOK) ===== */
.card {
  background: white;
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.06);
}

/* TITLES */
h3 {
  margin: 0 0 10px 0;
  font-size: 18px;
  color: #ff2f92;
}

/* INPUTS */
input, select {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #ddd;
  margin-bottom: 10px;
  font-size: 14px;
}

/* PRIMARY BUTTON */
button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 12px;
  background: #ff2f92;
  color: white;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
}

button:hover {
  background: #e60073;
}

/* PRODUCT ROW */
.item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px;
  border-radius: 12px;
  background: #fafafa;
  margin-bottom: 8px;
}

/* SMALL BUTTONS */
.small-btn {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  font-size: 18px;
  padding: 0;
}

/* CART */
.cart-item {
  background: #fafafa;
  padding: 10px;
  border-radius: 12px;
  margin-bottom: 8px;
}

/* SUMMARY */
.summary {
  background: #fff0f6;
  padding: 12px;
  border-radius: 14px;
  font-weight: 600;
}

/* BOX DESCRIPTIONS */
.box-desc {
  font-size: 13px;
  color: #555;
  margin-bottom: 10px;
  line-height: 1.4;
}

</style>
</head>

<body>

<header>Sweet Treats Bakery 🍰</header>
<img class="logo" src="logo.png"/>

<div class="container">

<!-- CUSTOMER -->
<div class="card">
<h3>Customer Info</h3>
<input id="name" placeholder="Full Name">
<input id="phone" placeholder="Phone Number">
<input id="email" placeholder="Email">
</div>

<!-- MENU -->
<div class="card">
<h3>Menu</h3>

<select id="item">
  <option value="Mini Cake|7">Mini Cake — $7+</option>
  <option value="Cupcakes|3">Cupcakes — $3</option>
  <option value="Cake Pops|2.5">Cake Pops — $2.50</option>
  <option value="Cookies|3">Cookies — $3</option>

  <option value="Dipped Oreos|1.5">Dipped Oreos — $1.50</option>
  <option value="Dipped Pretzels|1.5">Dipped Pretzels — $1.50</option>
  <option value="Dipped Strawberries|1.5">Dipped Strawberries — $1.50</option>
  <option value="Dipped Rice Krispies|1.5">Dipped Rice Krispies — $1.50</option>

  <option value="THE DEAL BOX|0">THE DEAL BOX</option>
  <option value="PARTY BOX|0">PARTY BOX</option>
</select>

<input type="number" id="qty" value="1" min="1" max="12">

<button onclick="addItem()">Add to Cart</button>
</div>

<!-- DELIVERY -->
<div class="card">
<h3>Delivery</h3>

<select id="deliveryType" onchange="toggleAddress()">
  <option value="pickup">Pickup</option>
  <option value="delivery">Delivery</option>
</select>

<div id="addressBox" style="display:none;">
  <input id="address" placeholder="Address">
  <input id="zip" placeholder="ZIP Code">
</div>
</div>

<!-- CART -->
<div class="card">
<h3>Your Order</h3>

<div id="cart"></div>

<div class="summary" id="summary">
Total: $0.00<br>
Deposit: $0.00
</div>
</div>

<!-- CHECKOUT -->
<div class="card">
<h3>Checkout</h3>
<button onclick="checkout()">Pay Deposit (CashApp)</button>
</div>

</div>

<script>

let cart = [];

function addItem() {

  let [name, price] = document.getElementById("item").value.split("|");
  let qty = parseInt(document.getElementById("qty").value) || 1;

  cart.push({ name, price: parseFloat(price), qty });

  render();
}

function increaseQty(i) {
  cart[i].qty++;
  render();
}

function decreaseQty(i) {
  cart[i].qty--;
  if (cart[i].qty <= 0) cart.splice(i, 1);
  render();
}

/* BOX PRICES */
function dealBoxPrice() {
  return ((4*6*1.5)+(2*2.5)+(2*3)+(2*3)+(2*7))*0.85;
}

function partyBoxPrice() {
  return ((8*12*1.5)+(12*2.5)+(12*3)+(12*3)+(12*7))*0.85;
}

/* DELIVERY */
function deliveryFee() {
  if (document.getElementById("deliveryType").value !== "delivery") return 0;

  let zip = document.getElementById("zip").value || "";

  if (zip.startsWith("606")) return 5;
  if (zip.startsWith("607") || zip.startsWith("608")) return 8;

  return 10;
}

/* RENDER */
function render() {

  let html = "";
  let total = 0;

  cart.forEach((item, i) => {

    let price = item.price;

    if (item.name === "THE DEAL BOX") price = dealBoxPrice();
    if (item.name === "PARTY BOX") price = partyBoxPrice();

    let itemTotal = price * item.qty;
    total += itemTotal;

    html += `
      <div class="cart-item">
        <b>${item.name}</b><br>
        $${price.toFixed(2)} × ${item.qty} = $${itemTotal.toFixed(2)}<br>

        <button class="small-btn" onclick="decreaseQty(${i})">−</button>
        <button class="small-btn" onclick="increaseQty(${i})">+</button>
      </div>
    `;
  });

  total += deliveryFee();

  let deposit = total / 2;

  document.getElementById("cart").innerHTML =
    html || "Your cart is empty";

  document.getElementById("summary").innerHTML = `
    Total: $${total.toFixed(2)}<br>
    Deposit: $${deposit.toFixed(2)}
  `;
}

function checkout() {

  if (cart.length === 0) return alert("Cart empty");

  let name = document.getElementById("name").value;
  let phone = document.getElementById("phone").value;
  let email = document.getElementById("email").value;

  if (!name || !phone || !email) {
    alert("Fill out all info");
    return;
  }

  let total = 0;

  cart.forEach(i => {
    let price = i.price;

    if (i.name === "THE DEAL BOX") price = dealBoxPrice();
    if (i.name === "PARTY BOX") price = partyBoxPrice();

    total += price * i.qty;
  });

  total += deliveryFee();

  let deposit = total / 2;

  window.location.href =
    `https://cash.app/$TommiGriffen/${deposit.toFixed(2)}`;
}

function toggleAddress() {
  document.getElementById("addressBox").style.display =
    document.getElementById("deliveryType").value === "delivery"
      ? "block"
      : "none";
}

</script>

</body>
</html>
